services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: nadskitchen_app
    working_dir: /var/www
    volumes:
      - ./:/var/www
    depends_on:
      - mysql

  webserver:
    image: nginx:alpine
    container_name: nadskitchen_webserver
    ports:
      - '8000:80'
    volumes:
      - ./:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app

  mysql:
    image: mysql:8.0
    container_name: nadskitchen_mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: nadskitchen_db
      MYSQL_USER: nadskitchen
      MYSQL_PASSWORD: secret
      MYSQL_ROOT_PASSWORD: root
    ports:
      - '3307:3306'
    volumes:
      - nadskitchen_mysql_data:/var/lib/mysql

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: nadskitchen_phpmyadmin
    restart: unless-stopped
    ports:
      - '8080:80'
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      PMA_USER: root
      PMA_PASSWORD: root
    depends_on:
      - mysql

volumes:
  nadskitchen_mysql_data:
